<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <!-- スマホ表示に対応 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ページタイトル -->
    <title>アクセス | 江井ヶ島不動産合同会社</title>

    <!-- CSSを読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pc.css">
    <link rel="stylesheet" href="css/sp.css">
    <link rel="stylesheet" href="css/access.css">
</head>

<body>

    <!-- ヘッダーを読み込む -->
    <div id="header"></div>

    <!-- メインコンテンツ -->
    <main>

        <!-- ページタイトル -->
        <section class="access-title">

            <div class="container">

                <p>Access</p>

                <h2>アクセス</h2>

            </div>

        </section>

        <!-- アクセス情報 -->
        <section class="access-info-section">

            <div class="container">

                <div class="access-info">

                    <!-- 所在地 -->
                    <div class="access-item access-address">

                        <h3>所在地</h3>

                        <p>
                            明石市大久保町江井島266-1
                        </p>

                    </div>

                    <!-- 電車でのアクセス -->
                    <div class="access-item">

                        <h3>電車でお越しの場合</h3>

                        <p>
                            山陽電鉄 江井ヶ島駅 南へ徒歩5分
                        </p>

                    </div>

                    <!-- お車でのアクセス -->
                    <div class="access-item">

                        <h3>お車でお越しの場合</h3>

                        <p>
                            大久保IC降りて10分
                        </p>

                        <p>
                            駐車場：事務所北側に5台あり
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <!-- Googleマップ -->
        <section class="map-section">

            <div class="container">

                <div class="section-heading">

                    <p>Google Map</p>

                    <h2>地図</h2>

                </div>

                <div class="map-container">

                    <iframe
                        src="https://www.google.com/maps?q=明石市大久保町江井島266-1&output=embed"
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        allowfullscreen>
                    </iframe>

                </div>

            </div>

        </section>

        <!-- ご来店案内 -->
        <section class="access-guide">

            <div class="container">

                <h2>ご来店の際はお気軽にお越しください</h2>

                <p>
                    江井ヶ島不動産合同会社では、
                    不動産購入・売却やリフォームについてのご相談を承っています。
                </p>

                <p>
                    お車でお越しの方は、事務所北側の駐車場をご利用ください。
                </p>

            </div>

        </section>

    </main>

    <!-- フッターを読み込む -->
    <div id="footer"></div>

    <!-- JavaScriptを読み込む -->
    <script src="js/common.js"></script>

</body>

</html>
