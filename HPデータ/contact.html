<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <!-- スマホ表示に対応 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ページタイトル -->
    <title>お問い合わせ | 江井ヶ島不動産合同会社</title>

    <!-- CSSを読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pc.css">
    <link rel="stylesheet" href="css/sp.css">

    <!-- お問い合わせページの設定 -->
    <style>

        /* ページタイトル */
        .contact-title {
            padding: 80px 0;
            text-align: center;
            background-color: #f7f5f0;
        }

        .contact-title p {
            margin: 0;
            color: #6d9d59;
            font-size: 14px;
            line-height: 1.2;
            letter-spacing: 2px;
        }

        .contact-title h2 {
            margin: 8px 0 0;
            font-size: 42px;
            line-height: 1.3;
        }

        /* お問い合わせ */
        .contact-section {
            padding: 70px 0;
        }

        .contact-introduction {
            margin-bottom: 40px;
            text-align: center;
        }

        .contact-introduction p {
            margin: 5px 0;
        }

        /* お問い合わせ項目 */
        .contact-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }

        .contact-item {
            padding: 35px 30px;
            text-align: center;
            background-color: #fff;
            border: 1px solid #ddd;
            border-top: 4px solid #70a85a;
        }

        .contact-item h3 {
            margin: 0 0 15px;
            font-size: 22px;
            line-height: 1.4;
        }

        .contact-item p {
            margin: 5px 0;
            line-height: 1.6;
        }

        /* メールアドレス */
        .contact-email {
            margin-bottom: 25px !important;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        /* 簡単お問い合わせボタン */
        .contact-button {
            display: inline-block;
            min-width: 240px;
            padding: 14px 25px;

            color: #fff;
            background-color: #70a85a;

            border-radius: 4px;

            font-size: 17px;
            font-weight: bold;

            transition: opacity 0.2s;
        }

        .contact-button:hover {
            opacity: 0.75;
        }

        /* メールアドレスについて */
        .contact-note {
            margin-top: 40px;
            text-align: center;
            line-height: 1.7;
        }

        /* スマホ表示 */
        @media (max-width: 768px) {

            /* ページタイトル */
            .contact-title {
                padding: 50px 0;
            }

            .contact-title h2 {
                font-size: 32px;
            }

            /* お問い合わせ */
            .contact-section {
                padding: 50px 0;
            }

            .contact-list {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .contact-item {
                padding: 25px 18px;
            }

            .contact-item h3 {
                font-size: 20px;
            }

            .contact-button {
                width: 100%;
                min-width: 0;
            }

        }

    </style>
</head>

<body>

    <!-- ヘッダーを読み込む -->
    <div id="header"></div>

    <!-- メインコンテンツ -->
    <main>

        <!-- ページタイトル -->
        <section class="contact-title">

            <div class="container">

                <p>Contact</p>

                <h2>お問い合わせ</h2>

            </div>

        </section>

        <!-- お問い合わせ -->
        <section class="contact-section">

            <div class="container">

                <div class="contact-introduction">

                    <p>
                        不動産やリフォームについてのお問い合わせは、
                        下記よりお気軽にご連絡ください。
                    </p>

                </div>

                <div class="contact-list">

                    <!-- 不動産のお問い合わせ -->
                    <div class="contact-item">

                        <h3>不動産の売却・購入</h3>

                        <p class="contact-email">
                            eigashima@gaia.eonet.ne.jp
                        </p>

                        <a
                            class="contact-button"
                            href="mailto:eigashima@gaia.eonet.ne.jp?subject=%E4%B8%8D%E5%8B%95%E7%94%A3%E3%81%AE%E7%9B%B8%E8%AB%87&body=%E4%BB%B6%E5%90%8D%EF%BC%9A%E4%B8%8D%E5%8B%95%E7%94%A3%E3%81%AE%E7%9B%B8%E8%AB%87%0A%0A%E3%81%94%E4%BD%8F%E6%89%80%EF%BC%9A%0A%E3%81%8A%E5%90%8D%E5%89%8D%EF%BC%9A%0A%E3%81%8A%E9%9B%BB%E8%A9%B1%E7%95%AA%E5%8F%B7%EF%BC%9A%0A%0A%E3%81%94%E7%9B%B8%E8%AB%87%E5%86%85%E5%AE%B9%EF%BC%9A"
                        >
                            簡単お問い合わせ
                        </a>

                    </div>

                    <!-- リフォームのお問い合わせ -->
                    <div class="contact-item">

                        <h3>リフォームのご相談</h3>

                        <p class="contact-email">
                            eigashima_estate@yahoo.co.jp
                        </p>

                        <a
                            class="contact-button"
                            href="mailto:eigashima_estate@yahoo.co.jp?subject=%E3%83%AA%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A0%E3%81%AE%E7%9B%B8%E8%AB%87&body=%E4%BB%B6%E5%90%8D%EF%BC%9A%E3%83%AA%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A0%E3%81%AE%E7%9B%B8%E8%AB%87%0A%0A%E3%81%94%E4%BD%8F%E6%89%80%EF%BC%9A%0A%E3%81%8A%E5%90%8D%E5%89%8D%EF%BC%9A%0A%E3%81%8A%E9%9B%BB%E8%A9%B1%E7%95%AA%E5%8F%B7%EF%BC%9A%0A%0A%E3%81%94%E7%9B%B8%E8%AB%87%E5%86%85%E5%AE%B9%EF%BC%9A"
                        >
                            簡単お問い合わせ
                        </a>

                    </div>

                </div>

                <p class="contact-note">
                    メールソフトが起動しますので、内容をご確認のうえ送信してください。
                </p>

            </div>

        </section>

    </main>

    <!-- フッターを読み込む -->
    <div id="footer"></div>

    <!-- JavaScriptを読み込む -->
    <script src="js/common.js"></script>

</body>

</html>
