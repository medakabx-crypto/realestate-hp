<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <!-- スマホ表示に対応 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ページタイトル -->
    <title>江井ヶ島不動産合同会社</title>

    <!-- CSSを読み込み -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pc.css">
    <link rel="stylesheet" href="css/sp.css">

    <!-- トップページの余白を設定 -->
    <style>
        .catch-section {
            padding: 60px 0;
        }

        .about-section {
            padding: 60px 0;
        }

        .company-section {
            padding: 60px 0;
        }

        .calendar-section {
            padding: 60px 0;
        }

        .catch-section h2 {
            line-height: 1.8;
        }

        .about-section p {
            line-height: 1.8;
        }

        .company-info p {
            line-height: 1.8;
        }

        .calendar-description {
            line-height: 1.8;
        }

        /* スマホ表示 */
        @media (max-width: 768px) {

            .catch-section {
                padding: 40px 0;
            }

            .about-section {
                padding: 40px 0;
            }

            .company-section {
                padding: 40px 0;
            }

            .calendar-section {
                padding: 40px 0;
            }

        }
    </style>
</head>

<body>

    <!-- ヘッダーを読み込む -->
    <div id="header"></div>


    <!-- メインコンテンツ -->
    <main>

        <!-- メインビジュアル -->
        <section class="hero">

            <img
                src="images/top_1.jpg"
                alt="江井ヶ島不動産合同会社 外観"
            >

            <div class="hero-text">

                <p>地域に根ざした不動産会社</p>

                <h2>江井ヶ島不動産合同会社</h2>

            </div>

        </section>


        <!-- キャッチコピー -->
        <section class="catch-section">

            <div class="container">

                <h2>
                    明石市・神戸市・播磨町・稲美町・高砂市・加古川市の<br>
                    不動産購入や売却は江井ヶ島不動産合同会社へ
                </h2>

            </div>

        </section>


        <!-- 会社紹介 -->
        <section class="about-section">

            <div class="container">

                <h2>江井ヶ島不動産合同会社について</h2>

                <p>
                    明石市大久保町江井島に店舗を構え、
                    不動産仲介業を行っている江井ヶ島不動産合同会社です。
                </p>

            </div>

        </section>


        <!-- 会社情報 -->
        <section class="company-section">

            <div class="container">

                <h2>会社情報</h2>

                <div class="company-info">

                    <!-- 電話番号 -->
                    <p>
                        <span>電話番号</span>
                        <a href="tel:078-947-6155">
                            078-947-6155
                        </a>
                    </p>

                    <!-- 営業時間 -->
                    <p>
                        <span>営業時間</span>
                        <span>9:00～17:30</span>
                    </p>

                    <!-- 休日 -->
                    <p>
                        <span>休日</span>
                        <span>
                            日曜・祝祭日・第2土曜・第3土曜
                        </span>
                    </p>

                    <!-- 所在地 -->
                    <p>
                        <span>所在地</span>
                        <span>
                            明石市大久保町江井島266-1
                        </span>
                    </p>

                    <!-- アクセス -->
                    <p>
                        <span>アクセス</span>
                        <span>
                            山陽電鉄 江井ヶ島駅 南へ徒歩5分
                        </span>
                    </p>

                    <!-- 駐車場 -->
                    <p>
                        <span>駐車場</span>
                        <span>
                            事務所北側に5台あり
                        </span>
                    </p>

                </div>

            </div>

        </section>


        <!-- 営業日カレンダー -->
        <section class="calendar-section">

            <div class="container">

                <h2>営業日カレンダー</h2>

                <p class="calendar-description">
                    営業日・休業日は下記カレンダーをご確認ください。
                </p>

                <!-- Googleカレンダー -->
                <div class="calendar-container">

                    <!-- Googleカレンダー設定後にURLを設定 -->
                    <iframe
                        src="https://calendar.google.com/calendar/embed?src=525c1c0a2af0da8d5f253ba66de0cc15ac305cb6681c5e671f41e4b92a26dbcc%40group.calendar.google.com&ctz=Asia%2FTokyo"
                        style="border: 0"
                        width="800"
                        height="600"
                        frameborder="0"
                        scrolling="no">
                    </iframe>

                </div>

            </div>

        </section>

    </main>


    <!-- フッターを読み込む -->
    <div id="footer"></div>


    <!-- JavaScriptを読み込む -->
    <script src="js/common.js"></script>

</body>

</html>
